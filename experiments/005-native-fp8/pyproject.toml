[project]
name = "opt-fp8-probe"
version = "0.0.0"
description = "SPIKE: experiment 005 probe. Observes SGLang's native FP8 linear path to prove engagement. Not production code."
requires-python = ">=3.10"

[project.entry-points."sglang.multimodal_gen.plugins"]
opt_fp8_probe = "opt_fp8_probe.plugin:register"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["opt_fp8_probe"]
